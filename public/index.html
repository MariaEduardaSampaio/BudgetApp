<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: no iPhone, o app respeita o notch e a barra de início (safe area). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orçamentos · Oficina Alocar</title>
    <meta name="description" content="Orçamentos da Oficina Alocar" />
    <meta name="theme-color" content="#181818" />

    <!-- "Adicionar à Tela de Início": abre em tela cheia, com nome e ícone próprios. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orçamentos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #181818;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o app de orçamentos.
    </noscript>
    <div id="root"></div>
  </body>
</html>
