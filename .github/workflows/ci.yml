# Verifica o projeto a cada push e pull request na master:
# tipagem, lint, testes e build do site (o mesmo build que a Vercel faz).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Se chegar um push novo enquanto o anterior ainda roda, cancela o anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipagem, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipagem (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test -- --ci

      - name: Build do site
        run: npm run build:web
